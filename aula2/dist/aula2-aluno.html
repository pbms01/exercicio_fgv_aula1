:root {

}

    --muted: #97a2ae;
    --line: #2a333d;
    --line-strong: #4f5b68;
    --accent: #a3a6ff;
    --accent-ink: #12133a;
    --accent-soft: #23255a;
    --accent-track: #2f3268;
    --ok: #5ad48d;
    --ok-soft: #0f2d1d;
    --partial: #f2bd4a;
    --partial-soft: #33270b;
    --bad: #ff8a7e;
    --bad-soft: #3a1612;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116;
  --surface: #161c23;
  --surface-2: #1c232c;

body {

/* --- Topo fixo: etiqueta do exercício e progresso ------------------------ */
.topo {

/* --- Tarefa 1: células e cartões ---------------------------------------- */
.celulas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (min-width: 960px) { .celulas { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* --- Síntese: grade 4×3 -------------------------------------------------- */
.grade-caixa { overflow-x: auto; }

.grade td.correta { background: var(--ok-soft); color: var(--ok); }
.grade td.parcial { background: var(--partial-soft); color: var(--partial); }
.grade td.distrator { background: var(--bad-soft); color: var(--bad); }
.grade td.vazia { background: var(--surface-2); color: var(--muted); }

/* --- Tarefa 2 ------------------------------------------------------------ */
.perna { display: flex; flex-direction: column; gap: 0.4rem; }
.perna + .perna { border-top: 1px dashed var(--line-strong); padding-top: 0.75rem; }
.perna-rotulo { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }

.requisitos { display: flex; flex-direction: column; gap: 0.5rem; }
.requisito {
  font: inherit;
  text-align: left;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 0.7rem 0.8rem;
  min-height: 44px;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.15rem 0.7rem;
  align-items: start;
}
.requisito .caixa {
  grid-row: span 2;
  width: 22px; height: 22px;
  border: 2px solid var(--line-strong);
  border-radius: 5px;
  display: grid;
  place-items: center;
  margin-top: 2px;
}
.requisito[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }
.requisito[aria-pressed="true"] .caixa { border-color: var(--ok); background: var(--ok); color: var(--surface); }
.requisito .onde { color: var(--ink-2); font-size: 0.9rem; }
.conclusao { border: 2px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 0.85rem 1rem; font-weight: 600; }

.controle { display: flex; flex-direction: column; gap: 0.3rem; }

.controle label { font-weight: 700; }
.controle output { font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.medidores { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.9rem; }
@media (min-width: 640px) { .medidores { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.medidor { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.medidor-rotulo { font-size: 0.85rem; font-weight: 700; color: var(--ink-2); }
.medidor-valor { font-size: 1.9rem; font-weight: 800; font-stretch: 85%; line-height: 1.1; }
.medidor-trilho { position: relative; height: 12px; border-radius: 6px; background: var(--accent-track); }

.medidor-escala { position: relative; height: 1.1rem; font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); }
.medidor-escala span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

.medidor-estado.fraca { color: var(--partial); }

.chave { display: flex; gap: 0.7rem; align-items: flex-start; cursor: pointer; padding: 0.6rem 0.75rem; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }

<script type="application/json" id="conteudo">{"versao":"1.0.0","conferido_em":"17/10/2026","link_aluno":"https://claude.ai/artifact/RPeXoRC9RSNtCFsaHewRc2","caso":{"titulo":"O golpe da falsa central","linhas":["Lúcia Andrade Fictícia, 74 anos, recebeu mensagens e uma ligação de uma falsa central do Banco Fictício. A voz do atendente era sintetizada, e o chip da linha dela foi trocado.","Convencida de que protegia a própria conta, ela mesma fez um Pix de R$ 18.400 para a conta de um terceiro.","A conta tinha sido cedida pelo titular. O dinheiro foi sacado em espécie num terminal da agência Centro, em Vila Quixote, às 13h47.","Enquadramento fixado na Aula I: estelionato eletrônico contra idosa (CP, art. 171, §2º-A, com o aumento do §4º) e cessão de conta (art. 171, §2º, VII)."],"pergunta":"Como o Estado chega ao rastro e prova que ele não mudou?","instrucao":"Em cada elo, escolha três coisas: o requisito processual, a salvaguarda da Convenção de Budapeste e o passo técnico. Toque num cartão para ver o fundamento.","aviso":"Caso fictício. Nenhuma pessoa, banco ou processo real."},"colunas":[{"id":"requisito","rotulo":"Requisito processual","leitura":"regime"},{"id":"budapeste","rotulo":"Salvaguarda de Budapeste","leitura":"Budapeste adjetiva"},{"id":"tecnico","rotulo":"Passo técnico","leitura":"norma técnica"}],"elos":[{"id":"e1","titulo":"Registros do aplicativo da falsa central","contexto":"A falsa central falou com a vítima por um aplicativo de mensagens. O provedor do aplicativo guarda os registros de acesso: IP, data e hora.","celulas":{"requisito":{"pergunta":"O que a polícia precisa para obter esses registros?","cartoes":[{"id":"b","texto":"Requisição direta do delegado ao provedor, sem ordem judicial.","tipo":"distrator","sintese":"Não. Requisição direta só alcança dados cadastrais.","detalhe":"Autoridades administrativas com competência legal podem requisitar dados cadastrais: qualificação pessoal, filiação e endereço. Registro de acesso a aplicação exige ordem judicial.","fundamentos":["MCI, art. 10, §3º","Decreto 8.771/2016, art. 11","MCI, art. 10, §1º"]},{"id":"a","texto":"Pedido cautelar de guarda ao provedor e ordem judicial de fornecimento, com fundados indícios, justificativa e período definido.","tipo":"correta","sintese":"Correto. A guarda pode ser pedida pela polícia ou pelo MP; o fornecimento exige ordem judicial.","detalhe":"A autoridade policial ou o MP podem requerer cautelarmente a guarda dos registros. O fornecimento depende de ordem judicial com fundados indícios do ilícito, justificativa motivada da utilidade e período. A guarda obrigatória é de 6 meses para registros de aplicação e de 1 ano para registros de conexão. Sem pedido cautelar a tempo, o registro some, e a ausência de log não prova que o fato não ocorreu.","fundamentos":["MCI, art. 15, §2º, c/c art. 13, §§3º e 4º","MCI, art. 22, parágrafo único, I a III","MCI, art. 10, §1º"]},{"id":"c","texto":"Autorização de interceptação telemática pela Lei 9.296/1996.","tipo":"distrator","sintese":"Não. A Lei 9.296 rege o fluxo em curso; registro armazenado é dado estático.","detalhe":"Interceptação capta a comunicação enquanto ela acontece. Registros já guardados pelo provedor são dados estáticos, e o acesso a eles segue o Marco Civil da Internet.","fundamentos":["Lei 9.296/1996, art. 1º","MCI, arts. 10 e 22"]}]},"budapeste":{"pergunta":"Qual poder da Convenção cobre a medida?","cartoes":[{"id":"c","texto":"Busca e apreensão de dados armazenados (art. 19).","tipo":"distrator","sintese":"Não. O Estado não entra no sistema do provedor; ordena que ele produza o dado.","detalhe":"O art. 19 serve para quando o próprio Estado busca e apreende dados num sistema. Aqui o dado está com o provedor, e o caminho é a injunção de produção do art. 18.","fundamentos":["Convenção de Budapeste, arts. 18 e 19"]},{"id":"b","texto":"Interceptação de dados de conteúdo (art. 21).","tipo":"distrator","sintese":"Não. O art. 21 trata de conteúdo em tempo real; aqui se quer registro armazenado.","detalhe":"O art. 21 cobre a captação do conteúdo das comunicações enquanto elas ocorrem. Registros de acesso já guardados são outro objeto.","fundamentos":["Convenção de Budapeste, art. 21"]},{"id":"a","texto":"Preservação expedita (arts. 16 e 17) e injunção de produção (art. 18), sob as salvaguardas do art. 15.","tipo":"correta","sintese":"Correto. Preserva-se primeiro, e depois se ordena a entrega.","detalhe":"O art. 16 congela o dado armazenado. O art. 17 acrescenta a revelação parcial dos dados de tráfego, suficiente para identificar o caminho da comunicação e o próximo provedor. O art. 18 ordena ao provedor que entregue o dado. Tudo sob as condições e salvaguardas do art. 15.","fundamentos":["Convenção de Budapeste, arts. 15 a 18","Decreto 11.491/2023"]}]},"tecnico":{"pergunta":"Qual passo técnico garante que o registro sirva como prova?","cartoes":[{"id":"a","texto":"Exigir IP com data, hora, fuso e porta lógica de origem; levar o conjunto ao provedor de conexão; calcular o hash do arquivo no recebimento.","tipo":"correta","sintese":"Correto. Sem porta lógica e instante exato, o IP aponta um grupo, não uma pessoa.","detalhe":"Com IPv4 compartilhado (CGNAT), o mesmo IP atende muitos assinantes ao mesmo tempo; só a porta lógica e o instante exato, com fuso, individualizam o acesso. O STJ reconheceu o dever de fornecer a porta lógica, e o regulamento do Marco Civil passou a prevê-lo. O hash calculado no recebimento fixa o estado do arquivo.","fundamentos":["STJ, REsp 1.784.156/SP","Decreto 8.771/2016, art. 15-A (Decreto 12.975/2026)","ISO/IEC 27037"]},{"id":"b","texto":"O IP basta para individualizar o usuário.","tipo":"distrator","sintese":"Não. IP dinâmico e compartilhado aponta um grupo, não uma pessoa.","detalhe":"Com CGNAT, milhares de assinantes podem sair pelo mesmo IP no mesmo minuto. Sem porta lógica e instante, a identificação recai sobre um grupo.","fundamentos":["STJ, REsp 1.784.156/SP"]},{"id":"c","texto":"Anexar ao inquérito um print da tela do sistema do provedor.","tipo":"distrator","sintese":"Não. Print não tem integridade verificável.","detalhe":"A falta de procedimentos que garantam a integridade dos dados leva à inadmissibilidade da prova digital, e é ônus do Estado demonstrar a integridade da fonte.","fundamentos":["STJ, AgRg no HC 828.054/RN (5ª Turma, 2024)"]}]}}},{"id":"e2","titulo":"Localização da linha do titular da conta cedida","contexto":"A conta que recebeu o Pix pertence a Rafael Teste Fictício. Onde estava o celular dele às 13h47, hora do saque?","celulas":{"requisito":{"pergunta":"O que a polícia precisa para obter a localização pretérita da linha?","cartoes":[{"id":"b","texto":"Requisição direta à operadora pelo art. 13-B do CPP.","tipo":"distrator","sintese":"Não. O art. 13-B vale para crimes relacionados ao tráfico de pessoas, com delito em curso.","detalhe":"O dispositivo depende de autorização judicial e só admite requisição direta se o juiz não se manifestar em 12 horas. Não serve para dados pretéritos num estelionato.","fundamentos":["CPP, art. 13-B, caput e §4º"]},{"id":"c","texto":"Localização é dado não sensível e dispensa ordem judicial.","tipo":"distrator","sintese":"Não. Localização revela rotina e vida privada.","detalhe":"Histórico de localização expõe onde a pessoa mora, trabalha, reza e se trata. É o que está em jogo no Tema 1148 do STF, ainda sem tese, e o que a Suprema Corte dos EUA reconheceu em Chatrie v. United States (2026): obter histórico de localização é busca.","fundamentos":["CF, art. 5º, X","STF, Tema 1148 (em julgamento)"]},{"id":"a","texto":"Ordem judicial fundamentada para os dados de localização daquela linha, com pessoa determinada e período delimitado.","tipo":"correta","sintese":"Correto. Não é interceptação, porque não há fluxo em curso, mas a localização revela vida privada.","detalhe":"Dados de localização pretéritos expõem rotina e intimidade. A via segura é a ordem judicial que individualiza a linha e delimita o período. Há quem sustente a requisição direta de dados pretéritos de estação rádio base; a questão não está pacificada, e a ordem judicial afasta o risco de nulidade.","fundamentos":["CF, art. 5º, X e XII","MCI, art. 22, parágrafo único"]}]},"budapeste":{"pergunta":"Qual poder da Convenção cobre a medida?","cartoes":[{"id":"a","texto":"Injunção de produção dos dados já armazenados (art. 18), com preservação prévia (art. 17). Se a medida fosse prospectiva, coleta em tempo real de dados de tráfego (art. 20).","tipo":"correta","sintese":"Correto. Para o passado, preservar e ordenar a entrega; para o futuro, o poder é outro.","detalhe":"Dados de localização da operadora são dados de tráfego. Para o horário do saque, já passado, preserva-se e ordena-se a entrega. Acompanhar a linha dali em diante seria coleta em tempo real, regida pelo art. 20.","fundamentos":["Convenção de Budapeste, arts. 17, 18 e 20"]},{"id":"b","texto":"Apenas preservação expedita (art. 16).","tipo":"distrator","sintese":"Não. Preservar não é acessar.","detalhe":"A preservação congela o dado em poder da operadora. A entrega à autoridade exige a injunção de produção do art. 18.","fundamentos":["Convenção de Budapeste, arts. 16 e 18"]},{"id":"c","texto":"Interceptação de conteúdo (art. 21).","tipo":"distrator","sintese":"Não. O pedido é de localização, não de conteúdo.","detalhe":"O art. 21 trata do conteúdo das comunicações em tempo real. Onde a linha estava é dado de tráfego.","fundamentos":["Convenção de Budapeste, arts. 1º, d, e 21"]}]},"tecnico":{"pergunta":"Como ler o dado que a operadora entregar?","cartoes":[{"id":"c","texto":"Converter a planilha da operadora para PDF e assinar.","tipo":"distrator","sintese":"Não. A conversão altera o objeto.","detalhe":"Preserva-se o arquivo original entregue pela operadora, com o hash calculado no recebimento. O PDF é outro objeto.","fundamentos":["ISO/IEC 27037","CPP, art. 158-A"]},{"id":"a","texto":"Tratar a estação rádio base como área: registrar setor, azimute, alcance da célula e margem de incerteza; calcular o hash do arquivo entregue.","tipo":"correta","sintese":"Correto. A antena diz onde o aparelho podia estar, não onde estava.","detalhe":"Uma estação rádio base atende uma área; o aparelho pode estar em qualquer ponto do setor. O laudo registra a área e a margem, e não um ponto.","fundamentos":["ISO/IEC 27037","CPP, art. 158-A"]},{"id":"b","texto":"A coordenada da antena é a posição do aparelho.","tipo":"distrator","sintese":"Não. A antena atende uma área inteira.","detalhe":"Tomar a coordenada da antena como posição do aparelho transforma uma área de centenas de metros num ponto falso.","fundamentos":["ISO/IEC 27037"]}]}}},{"id":"e3","titulo":"Extração do celular do titular","contexto":"Com mandado de busca domiciliar, a polícia apreendeu o celular de Rafael em casa. O conteúdo pode explicar o saque.","celulas":{"requisito":{"pergunta":"O que autoriza acessar o conteúdo do aparelho?","cartoes":[{"id":"a","texto":"A apreensão não depende de ordem específica; o acesso ao conteúdo exige consentimento expresso do titular ou decisão judicial prévia; os dados podem ser preservados antes, com justificativa posterior.","tipo":"correta","sintese":"Correto. Apreender não é acessar.","detalhe":"No Tema 977, o STF separou a apreensão do aparelho, que não está sujeita à reserva de jurisdição, do acesso aos dados. Fora do encontro fortuito, o acesso depende de consentimento expresso ou decisão judicial. A autoridade pode adotar medidas para preservar os dados antes da autorização.","fundamentos":["STF, Tema 977 (ARE 1.042.075, julgado em 25/06/2025)"]},{"id":"c","texto":"Como o celular apareceu na busca, vale a regra do encontro fortuito, e a extração completa está liberada.","tipo":"distrator","sintese":"Não. O encontro fortuito tem alcance estreito, e aqui houve apreensão formal.","detalhe":"No encontro fortuito, o acesso sem ordem só serve para esclarecer a autoria ou identificar o proprietário, com justificativa posterior. Não autoriza extração completa.","fundamentos":["STF, Tema 977"]},{"id":"b","texto":"A apreensão lícita autoriza abrir e examinar o aparelho.","tipo":"distrator","sintese":"Não. Apreender não é acessar.","detalhe":"A apreensão física do aparelho e o acesso aos dados são atos distintos, com requisitos distintos.","fundamentos":["STF, Tema 977"]}]},"budapeste":{"pergunta":"Qual poder da Convenção cobre a medida?","cartoes":[{"id":"b","texto":"Injunção de produção (art. 18).","tipo":"distrator","sintese":"Não. A injunção serve para quem detém o dado entregá-lo.","detalhe":"Aqui o Estado já tem o aparelho em mãos. O poder pertinente é a busca e apreensão de dados armazenados.","fundamentos":["Convenção de Budapeste, arts. 18 e 19"]},{"id":"a","texto":"Busca e apreensão de dados armazenados (art. 19), inclusive o dever de manter a integridade dos dados (art. 19.3.c), sob o art. 15.","tipo":"correta","sintese":"Correto. O Estado apreende e copia, e passa a responder pela integridade do dado.","detalhe":"O art. 19 cobre a busca e a apreensão de dados armazenados num sistema ou suporte. O art. 19.3.c impõe manter a integridade dos dados apreendidos. As salvaguardas do art. 15 valem para tudo.","fundamentos":["Convenção de Budapeste, arts. 15 e 19"]},{"id":"c","texto":"Preservação expedita (art. 16).","tipo":"distrator","sintese":"Não. Preservação congela o dado em poder de terceiro.","detalhe":"A medida aqui é apreensão e cópia pelo próprio Estado, não pedido de congelamento a um custodiante.","fundamentos":["Convenção de Budapeste, arts. 16 e 19"]}]},"tecnico":{"pergunta":"Como extrair sem comprometer a prova?","cartoes":[{"id":"b","texto":"O policial navega no aparelho e fotografa as telas relevantes.","tipo":"distrator","sintese":"Não. Altera o estado do aparelho e não gera cópia verificável.","detalhe":"Foi o quadro do AgRg no HC 828.054/RN: telas fotografadas de aparelho desbloqueado, sem extração, hash ou laudo. A prova foi declarada inadmissível. Além disso, esbarra no Tema 977.","fundamentos":["STJ, AgRg no HC 828.054/RN","STF, Tema 977"]},{"id":"c","texto":"Calcular o MD5 da imagem extraída.","tipo":"distrator","sintese":"Não. MD5 não serve onde se exige resistência a colisão.","detalhe":"O MD5 tem colisões conhecidas e não é aceitável onde a resistência a colisão importa. Use SHA-256 ou superior.","fundamentos":["RFC 6151"]},{"id":"a","texto":"Isolar o aparelho da rede (modo avião ou bolsa de Faraday), extrair com ferramenta forense validada, calcular o SHA-256 da imagem no ato, lacrar e registrar.","tipo":"correta","sintese":"Correto. Isolamento, ferramenta validada, hash e lacre.","detalhe":"O isolamento impede alteração ou apagamento remoto. O hash calculado no ato fixa a imagem. O lacre e o registro seguem as etapas de coleta e acondicionamento do CPP.","fundamentos":["CPP, art. 158-B, IV e V","CPP, art. 158-D","ISO/IEC 27037"]}]}}},{"id":"e4","titulo":"Laudo","contexto":"A imagem do celular chega à perícia. O laudo vai dizer o que há nela e como se chegou a isso.","celulas":{"requisito":{"pergunta":"Quais regras processuais regem o laudo?","cartoes":[{"id":"c","texto":"Qualquer lacuna documental na cadeia de custódia anula a prova.","tipo":"distrator","sintese":"Não. O STJ exige demonstração de quebra efetiva, não de falha formal.","detalhe":"Irregularidade na cadeia de custódia não gera nulidade automática; afeta o valor da prova e se examina no caso concreto. O ônus de demonstrar a integridade da fonte continua com o Estado.","fundamentos":["STJ, Corte Especial, Inq 1.658/DF (2025)","STJ, AgRg no HC 828.054/RN"]},{"id":"a","texto":"Perícia por perito oficial sobre o vestígio recebido e guardado na central de custódia, com registro de cada movimentação.","tipo":"correta","sintese":"Correto. Perito oficial e rastro documentado de cada movimentação.","detalhe":"O exame cabe ao perito oficial. O vestígio é recebido, processado e armazenado na central de custódia, e cada movimentação fica registrada até o retorno do material.","fundamentos":["CPP, art. 159","CPP, art. 158-B, VII a IX","CPP, arts. 158-E e 158-F"]},{"id":"b","texto":"O laudo é dispensável se o investigado confessar.","tipo":"distrator","sintese":"Não. A confissão não supre o exame.","detalhe":"Nas infrações que deixam vestígios, o exame de corpo de delito é indispensável e a confissão do acusado não o supre.","fundamentos":["CPP, art. 158"]}]},"budapeste":{"pergunta":"O que a Convenção diz sobre o laudo?","cartoes":[{"id":"b","texto":"O dever de integridade do art. 19.3.c.","tipo":"parcial","sintese":"Em parte. O dever de integridade acompanha o vestígio, mas não disciplina o exame.","detalhe":"O dever de manter a integridade nasce na apreensão e segue com o vestígio até a perícia. Ele não regula como o exame é feito.","fundamentos":["Convenção de Budapeste, art. 19.3.c"]},{"id":"c","texto":"Interceptação (art. 21).","tipo":"distrator","sintese":"Não. Sem relação com o laudo.","detalhe":"O art. 21 trata de captação de conteúdo em tempo real.","fundamentos":["Convenção de Budapeste, art. 21"]},{"id":"a","texto":"As salvaguardas gerais do art. 15: proporcionalidade, supervisão e fundamentação.","tipo":"correta","sintese":"Correto. A Convenção não tem regra própria sobre laudo; valem as salvaguardas gerais.","detalhe":"Os arts. 16 a 21 regulam poderes de obtenção de dados, não a perícia. O que alcança o exame são as condições e salvaguardas do art. 15.","fundamentos":["Convenção de Budapeste, art. 15"]}]},"tecnico":{"pergunta":"Qual passo técnico sustenta o laudo?","cartoes":[{"id":"a","texto":"Recalcular o hash antes do exame e conferir com o da coleta; examinar uma cópia de trabalho; documentar ferramentas, versões e passos de modo reprodutível.","tipo":"correta","sintese":"Correto. Conferência do hash, cópia de trabalho e método reprodutível.","detalhe":"O hash recalculado prova que a imagem é a mesma da coleta. A cópia de trabalho protege o original. A documentação permite que outro perito refaça o caminho.","fundamentos":["ISO/IEC 27041","ISO/IEC 27042"]},{"id":"c","texto":"Examinar o original para ganhar tempo.","tipo":"distrator","sintese":"Não. Risco de alteração irreversível.","detalhe":"A regra é examinar uma cópia de trabalho e manter o original intacto e lacrado.","fundamentos":["ISO/IEC 27037","ISO/IEC 27042"]},{"id":"b","texto":"Hash conferido, logo o conteúdo é verdadeiro.","tipo":"distrator","sintese":"Não. Integridade não é autenticidade.","detalhe":"O hash prova que a cópia não mudou, não que o conteúdo é verdadeiro. O áudio da falsa central achado na extração tem hash perfeito e continua sendo voz sintetizada. Esta é a ponte para a Aula III.","fundamentos":["ISO/IEC 27042"]}]}}}],"impasse":{"titulo":"O impasse","linhas":["A localização mostra Rafael a cerca de 30 km do terminal às 13h47.","A extração revela que ele vendeu o acesso à conta.","Quem sacou continua desconhecido, e as imagens do terminal são de baixa resolução."],"botao":"Ver o pedido do delegado"},"pedido":{"titulo":"O pedido do delegado","abertura":"Representação fictícia. O delegado pede que a Justiça determine aos provedores:","pernas":[{"id":"cerca","rotulo":"Cerca geográfica","texto":"Identificação de todos os dispositivos num raio de 300 m do terminal, das 13h às 15h do dia do saque. O registro do banco marca o saque às 13h47.","precedente":"A cerca geográfica foi admitida pelo STJ no caso Marielle (RMS 60.698/RJ, 2020)."},{"id":"palavra","rotulo":"Palavras-chave","texto":"Identificação de todos os usuários que pesquisaram o nome da vítima ou \"central de atendimento\" com o nome do Banco Fictício, nos 30 dias anteriores ao saque.","precedente":"A busca por palavras-chave está no STF (Tema 1148, RE 1.301.250), sem tese fixada."}],"requisitos":[{"id":"indicios","rotulo":"Fundados indícios da ocorrência do ilícito","onde":"O Pix, o saque registrado e a extração do celular do titular."},{"id":"justificativa","rotulo":"Justificativa motivada da utilidade dos registros","onde":"Identificar quem sacou o dinheiro."},{"id":"periodo","rotulo":"Período ao qual se referem os registros","onde":"Das 13h às 15h do dia do saque; 30 dias anteriores."}],"fundamento_requisitos":"MCI, art. 22, parágrafo único, I a III","conclusao":"Os três requisitos estão presentes. O pedido é formalmente admissível, e a questão passa ao mérito. Forma completa não decide proporcionalidade."},"modelo":{"rho":0.03,"tau":15,"sigma":25,"centro":"13:47","raio":{"min":25,"max":500,"passo":25,"pedido":300},"janela":{"min":10,"max":120,"passo":10,"pedido":120},"limite_terceiros":1000,"limite_captura":0.5,"ressalva":"Estimativa ilustrativa: números fictícios para mostrar a forma da troca, não a grandeza real.","ressalva_captura":"Supondo que o sacador portava aparelho com localização ativa.","explicacao":"Terceiros alcançados crescem com a área do círculo e com a janela. A chance de alcançar o sacador depende só do raio, porque o erro de localização é radial; a janela fica centrada no horário do registro do banco."},"palavras":{"termos":[{"id":"pedido","rotulo":"Os dois termos, como pedido","generico":true},{"id":"central","rotulo":"Só \"central de atendimento\" com o nome do banco","generico":true},{"id":"nome","rotulo":"Só o nome completo da vítima","generico":false}],"periodos":[{"dias":30,"rotulo":"30 dias"},{"dias":7,"rotulo":"7 dias"}],"grandeza":{"pedido":{"7":"milhares","30":"dezenas de milhares"},"central":{"7":"milhares","30":"dezenas de milhares"},"nome":{"7":"unidades a dezenas","30":"dezenas"}},"explicacao":"Não há modelo numérico defensável para palavras-chave. A ordem de grandeza depende da especificidade do termo: \"central de atendimento\" com o nome do banco alcança clientes legítimos às dezenas de milhares; o nome completo da vítima, às dezenas."},"necessidade":{"titulo":"Necessidade","pergunta":"Há meio menos invasivo igualmente idôneo para identificar quem sacou?","meios":[{"rotulo":"Imagens do terminal e da agência","estado":"Já obtidas. Baixa resolução; não identificam o rosto."},{"rotulo":"Dados do cartão usado no saque","estado":"Apontam a conta cedida, não a pessoa que sacou."},{"rotulo":"Oitiva de testemunhas da agência","estado":"Ainda não realizada."},{"rotulo":"Localização direcionada da linha do titular","estado":"Já feita no Elo 2: ele estava a 30 km."}],"opcoes":[{"id":"sim","rotulo":"Satisfeita: não há meio menos invasivo igualmente idôneo"},{"id":"nao","rotulo":"Não satisfeita: ainda há meio menos invasivo a tentar"}],"feedback":"Aqui não há gabarito. A subsidiariedade aparece entre as condicionantes propostas nos votos que admitem a busca reversa no Tema 1148. Repare que a oitiva das testemunhas ainda não foi tentada."},"estrita":{"titulo":"Proporcionalidade estrita","gravidade":{"pergunta":"O crime do caso é hediondo ou equiparado?","opcoes":[{"id":"sim","rotulo":"Sim"},{"id":"nao","rotulo":"Não"}],"resposta":"nao","feedback_certo":"Correto: não é. Estelionato eletrônico e cessão de conta não constam da Lei 8.072/1990.","feedback_errado":"Não é. Estelionato eletrônico e cessão de conta não constam da Lei 8.072/1990.","criterio":"Adoto como critério restringir a busca reversa a crimes hediondos e equiparados.","fonte":"Restrição proposta em votos do Tema 1148, como os de Nunes Marques e Gilmar Mendes."},"delimitacao":{"rotulo":"Delimitação temporal e temática","fonte":"Lida dos parâmetros que você escolheu nas telas anteriores."},"etapas":{"rotulo":"Exigir procedimento em etapas para descartar os inocentes","passos":["Lista anonimizada dos dispositivos.","Estreitamento pela autoridade, ainda sem identificação.","Identificação só dos remanescentes, por nova decisão judicial."],"fonte":"É o procedimento de três etapas do Google examinado em Chatrie v. United States (Suprema Corte dos EUA, 29/06/2026). A Corte decidiu que obter o histórico de localização é busca e devolveu o caso ao tribunal de origem para examinar se o mandado autorizou uma busca razoável."},"placar":"Tema 1148: julgamento suspenso por pedido de vista, sem tese fixada. Placar p <script>
// Lógica pura da Aula II, compartilhada pelo exercício do aluno (A) e pelo
// painel do professor (B). Sem DOM e sem rede: recebe o estado e o conteúdo,
// devolve números e textos. É injetada nos dois HTML pela montagem e testada
// em Node (test/logica.test.mjs), por isso se registra num global.
(function (raiz) {
  "use strict";

  var NF = new Intl.NumberFormat("pt-BR");

  // --- Modelo ilustrativo dos medidores (plano, seção 5) --------------------

  // Terceiros alcançados pela cerca: densidade × área × (1 + janela/permanência).
  // O fator (1 + T/τ) conta quem já estava no círculo mais quem entrou durante
  // a janela, com permanência média τ.
  function terceiros(raio, janelaMin, modelo) {
    return modelo.rho * Math.PI * raio * raio * (1 + janelaMin / modelo.tau);
  }

  // Chance de o aparelho do sacador cair dentro do raio: CDF de Rayleigh.
  // Erro de localização é radial; 1 − exp(−r²/2σ²), não 50% simétricos.
  function captura(raio, sigma) {
    return 1 - Math.exp(-(raio * raio) / (2 * sigma * sigma));
  }

  function formatarTerceiros(n) {
    if (n < 1000) return "≈ " + NF.format(Math.round(n / 10) * 10);
    if (n < 10000) return "≈ " + NF.format(Math.round(n / 100) * 100);
    return "≈ " + NF.format(Math.round(n / 1000)) + " mil";
  }

  function formatarPct(p) {
    if (p >= 0.995) return "> 99%";
    if (p < 0.005) return "< 1%";
    return Math.round(p * 100) + "%";
  }

  // Janela centrada no horário do registro do banco ("13:47").
  function janelaHorario(centro, janelaMin) {
    var partes = centro.split(":");
    var c = Number(partes[0]) * 60 + Number(partes[1]);
    var meia = janelaMin / 2;
    function fmt(min) {
      var h = Math.floor(min / 60);
      var m = Math.round(min % 60);
      return h + "h" + (m < 10 ? "0" + m : m);
    }
    return { inicio: fmt(c - meia), fim: fmt(c + meia) };
  }

  function grandezaPalavra(termo, dias, palavras) {
    var linha = palavras.grandeza[termo];
    return linha ? linha[String(dias)] : "";
  }

  function termoGenerico(termo, palavras) {
    var t = palavras.termos.find(function (x) { return x.id === termo; });
    return t ? t.generico : true;
  }

  // --- Decisão (Tarefa 2) ---------------------------------------------------

  // Parâmetros que a decisão efetivamente autoriza. "Defiro" concede o pedido
  // como veio (300 m, 13h às 15h, os dois termos, 30 dias, sem etapas);
  // "defiro com restrições" usa o que o aluno escolheu nas telas 7 e 9.
  function parametrosEfetivos(estado, conteudo) {
    var m = conteudo.modelo;
    var dc = estado.decisao.cerca.escolha;
    var dp = estado.decisao.palavra.escolha;
    var cerca = { escolha: dc, deferida: dc === "defiro" || dc === "restricoes" };
    if (dc === "defiro") {
      cerca.raio = m.raio.pedido;
      cerca.janela = m.janela.pedido;
      cerca.etapas = false;
    } else {
      cerca.raio = estado.raio;
      cerca.janela = estado.janela;
      cerca.etapas = Boolean(estado.etapas);
    }
    cerca.terceiros = terceiros(cerca.raio, cerca.janela, m);
    cerca.captura = captura(cerca.raio, m.sigma);

    var palavra = { escolha: dp, deferida: dp === "defiro" || dp === "restricoes" };
    if (dp === "defiro") {
      palavra.termo = "pedido";
      palavra.dias = 30;
    } else {
      palavra.termo = estado.termo;
      palavra.dias = estado.dias;
    }
    palavra.generico = termoGenerico(palavra.termo, conteudo.palavras);
    palavra.grandeza = grandezaPalavra(palavra.termo, palavra.dias, conteudo.palavras);
    return { cerca: cerca, palavra: palavra };
  }

  function decisaoCompleta(estado) {
    var d = estado.decisao;
    return Boolean(d.cerca.escolha && d.palavra.escolha);
  }

  // Seis sinais de incoerência (plano, tela 10), inspirados no CPP,
  // art. 315, §2º. Cada um olha só a sua condição, para que uma combinação
  // de teste dispare apenas o seu sinal.
  function sinaisIncoerencia(estado, conteudo) {
    if (!decisaoCompleta(estado)) return [];
    var p = parametrosEfetivos(estado, conteudo);
    var m = conteudo.modelo;
    var d = estado.decisao;
    var sinais = [];

    if (estado.necessidade === "nao" && (p.cerca.deferida || p.palavra.deferida)) {
      sinais.push("necessidade");
    }
    if (estado.adotaHediondos && p.palavra.deferida) {
      sinais.push("hediondos");
    }
    if (p.cerca.deferida && p.cerca.captura < m.limite_captura) {
      sinais.push("adequacao");
    }
    if (p.cerca.deferida && p.cerca.terceiros > m.limite_terceiros && !p.cerca.etapas) {
      sinais.push("estrita");
    }
    if (p.palavra.deferida && p.palavra.generico) {
      sinais.push("tematica");
    }
    var motivoVazio = function (perna) {
      var f = d[perna].fundamento;
      return d[perna].escolha === "indefiro" && (!f || f === "generico");
    };
    if (motivoVazio("cerca") || motivoVazio("palavra")) {
      sinais.push("motivacao");
    }
    return sinais;
  }

  function textoFundamento(perna, id, conteudo) {
    var lista = conteudo.decisao.fundamentos_indeferimento[perna];
    var f = lista.find(function (x) { return x.id === id; });
    return f ? f.texto : "motivo não indicado";
  }

  function rotuloTermo(termo, conteudo) {
    var t = conteudo.palavras.termos.find(function (x) { return x.id === termo; });
    return t ? t.rotulo.replace(/^Só /, "").replace(/^Os dois termos, como pedido$/, "os dois termos") : termo;
  }

  // Dispositivo de quatro ou cinco linhas montado com as escolhas do aluno.
  function montarDispositivo(estado, conteudo) {
    if (!decisaoCompleta(estado)) return [];
    var p = parametrosEfetivos(estado, conteudo);
    var m = conteudo.modelo;
    var d = estado.decisao;
    var linhas = ["Vistos. Decido a representação em duas partes."];

    if (p.cerca.escolha === "indefiro") {
      linhas.push("Cerca geográfica: INDEFIRO, por " + textoFundamento("cerca", d.cerca.fundamento, conteudo) + ".");
    } else {
      var j = janelaHorario(m.centro, p.cerca.janela);
      var cab = p.cerca.escolha === "defiro" ? "DEFIRO, como requerida" : "DEFIRO COM RESTRIÇÕES";
      var txt = "Cerca geográfica: " + cab + ": raio de " + p.cerca.raio + " m, das " + j.inicio + " às " + j.fim;
      txt += p.cerca.etapas
        ? ", com procedimento em etapas e identificação dos remanescentes só por nova decisão."
        : ".";
      linhas.push(txt);
      linhas.push(
        "Chance estimada de alcançar o sacador: " + formatarPct(p.cerca.captura) +
        ". Terceiros alcançados: " + formatarTerceiros(p.cerca.terceiros) + " (estimativa ilustrativa)."
      );
    }

    if (p.palavra.escolha === "indefiro") {
      linhas.push("Palavras-chave: INDEFIRO, por " + textoFundamento("palavra", d.palavra.fundamento, conteudo) + ".");
    } else {
      var cabp = p.palavra.escolha === "defiro" ? "DEFIRO, como requerida" : "DEFIRO COM RESTRIÇÕES";
      linhas.push(
        "Palavras-chave: " + cabp + ": " + rotuloTermo(p.palavra.termo, conteudo) +
        ", nos " + p.palavra.dias + " dias anteriores ao saque. Alcance estimado: " + p.palavra.grandeza + " de usuários."
      );
    }
    linhas.push("Intime-se.");
    return linhas;
  }

  // Cartão de decisão para erguer em sala.
  function cartao(estado, conteudo) {
    if (!decisaoCompleta(estado)) return null;
    var p = parametrosEfetivos(estado, conteudo);
    var nome = { defiro: "DEFIRO", restricoes: "DEFIRO COM RESTRIÇÕES", indefiro: "INDEFIRO" };
    var c = nome[p.cerca.escolha];
    if (p.cerca.escolha !== "indefiro") {
      c += " · " + p.cerca.raio + " m · " + p.cerca.janela + " min";
      if (p.cerca.etapas) c += " · em etapas";
    }
    var w = nome[p.palavra.escolha];
    if (p.palavra.escolha === "restricoes") {
      w += " · " + (p.palavra.termo === "nome" ? "nome da vítima" : p.palavra.termo === "central" ? "central + banco" : "os dois termos");
      w += " · " + p.palavra.dias + " dias";
    }
    return { cerca: c, palavra: w };
  }

  // --- Tarefa 1 -------------------------------------------------------------

  // Grade 4×3: para cada elo e coluna, o tipo do cartão escolhido
  // ("correta", "parcial", "distrator") ou null.
  function gradeEsteira(respostas, conteudo) {
    return conteudo.elos.map(function (elo) {
      return conteudo.colunas.map(function (col) {
        var escolhido = respostas[elo.id + "." + col.id];
        if (!escolhido) return null;
        var cartao = elo.celulas[col.id].cartoes.find(function (c) { return c.id === escolhido; });
        return cartao ? cartao.tipo : null;
      });
    });
  }

  function placarEsteira(respostas, conteudo) {
    var grade = gradeEsteira(respostas, conteudo);
    var t = { correta: 0, parcial: 0, distrator: 0, vazia: 0 };
    grade.forEach(function (linha) {
      linha.forEach(function (tipo) { t[tipo || "vazia"] += 1; });
    });
    return t;
  }

  function estadoInicial(conteudo) {
    return {
      v: 1,
      tela: 0,
      respostas: {},
      requisitos: {},
      raio: conteudo.modelo.raio.pedido,
      janela: conteudo.modelo.janela.pedido,
      termo: "pedido",
      dias: 30,
      necessidade: null,
      gravidade: null,
      adotaHediondos: false,
      etapas: false,
      decisao: {
        cerca: { escolha: null, fundamento: null },
        palavra: { escolha: null, fundamento: null }
      }
    };
  }

  raiz.Aula2Logica = {
    terceiros: terceiros,
    captura: captura,
    formatarTerceiros: formatarTerceiros,
    formatarPct: formatarPct,
    janelaHorario: janelaHorario,
    grandezaPalavra: grandezaPalavra,
    parametrosEfetivos: parametrosEfetivos,
    sinaisIncoerencia: sinaisIncoerencia,
    montarDispositivo: montarDispositivo,
    cartao: cartao,
    gradeEsteira: gradeEsteira,
    placarEsteira: placarEsteira,
    estadoInicial: estadoInicial
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
(function () {
  "use strict";
  var C = JSON.parse(document.getElementById("conteudo").textContent);
  var L = window.Aula2Logica;
  var CHAVE = "aula2.exercicio.v1";

  // Telas na ordem do plano (0 a 12).
  var TELAS = [
    { id: "abertura", onde: "Abertura" },

  // --- Estado: memória, espelhada no navegador -------------------------------
  // Decisão: localStorage só para sobreviver a um recarregamento acidental no
  // celular. Nenhum identificador é pedido e nada sai do aparelho.
  function carregar() {
    var base = L.estadoInicial(C);
    try {
      var s = localStorage.getItem(CHAVE);
      if (!s) return base;
      var e = JSON.parse(s);
      if (!e || e.v !== 1) return base;
      var out = Object.assign(base, e);
      out.decisao = {
        cerca: Object.assign({ escolha: null, fundamento: null }, e.decisao && e.decisao.cerca),
        palavra: Object.assign({ escolha: null, fundamento: null }, e.decisao && e.decisao.palavra)
      };
      out.respostas = e.respostas || {};
      out.requisitos = e.requisitos || {};
      out.tela = Math.min(Math.max(0, Number(e.tela) || 0), TELAS.length - 1);
      return out;
    } catch (_) {
      return base;
    }
  }
  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (_) { /* segue só em memória */ }
  }
  var estado = carregar();

  // --- Utilitário de DOM -----------------------------------------------------
  function h(tag, props, filhos) {
    var n = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? "" : String(v));
      });
    }
    (filhos || []).forEach(function (f) {
      if (f === null || f === undefined || f === false) return;
      n.append(f.nodeType ? f : document.createTextNode(String(f)));
    });
    return n;
  }

  var raizTela = document.getElementById("tela");

    estado.tela = Math.min(Math.max(0, i), TELAS.length - 1);

  function celula(elo, col) {
    var chave = elo.id + "." + col.id;
    var cel = elo.celulas[col.id];
    var escolhido = estado.respostas[chave] || null;
    var idTitulo = "q-" + elo.id + "-" + col.id;

    var lista = h("div", { class: "cartoes" });
    cel.cartoes.forEach(function (c) {
      var classes = "cartao";

      if (escolhido) {

        else { classes += " apagado"; }

        type: "button",

        "aria-pressed": c.id === escolhido ? "true" : "false",

        onclick: function () { if (!estado.respostas[chave]) responder(chave, c.id); }

      lista.append(b);

    return sec;

  function responder(chave, id) {
    estado.respostas[chave] = id;
    salvar();
    var partes = chave.split(".");
    var elo = C.elos.find(function (e) { return e.id === partes[0]; });
    var col = C.colunas.find(function (c) { return c.id === partes[1]; });

    var nova = celula(elo, col);
    antiga.replaceWith(nova);
    var s = nova.querySelector(".sintese");
    if (s) s.focus({ preventScroll: false });
    var cont = document.getElementById("contagem-elo");
    if (cont) cont.textContent = textoContagem(elo);
  }

  // --- Tela 7: adequação com medidores ----------------------------------------
  var LOG_MIN = 1, LOG_MAX = 5; // escala do medidor de terceiros: 10 a 100.000

  function pctLog(n) {
    var x = (Math.log10(Math.max(n, 10)) - LOG_MIN) / (LOG_MAX - LOG_MIN);

  }

  function atualizarMedidores() {
    var m = C.modelo;
    var n = L.terceiros(estado.raio, estado.janela, m);
    var p = L.captura(estado.raio, m.sigma);
    var j = L.janelaHorario(m.centro, estado.janela);
    var q = function (id) { return document.getElementById(id); };
    if (!q("val-terceiros")) return;
    q("out-raio").textContent = estado.raio + " m";
    q("out-janela").textContent = estado.janela + " min · " + j.inicio + " às " + j.fim;
    q("val-terceiros").textContent = L.formatarTerceiros(n);
    q("val-captura").textContent = L.formatarPct(p);
    q("barra-terceiros").style.width = pctLog(n) + "%";
    q("barra-captura").style.width = Math.round(p * 100) + "%";
    var acimaLimite = n > m.limite_terceiros;
    q("barra-terceiros").classList.toggle("alerta", acimaLimite);
    q("estado-terceiros").className = "medidor-estado " + (acimaLimite ? "alerta" : "ok");
    q("estado-terceiros").textContent = acimaLimite
      ? "⚠ Acima de 1.000 terceiros: só com procedimento em etapas."
      : "✓ Até 1.000 terceiros.";
    var fraca = p < m.limite_captura;
    q("barra-captura").classList.toggle("fraca", fraca);
    q("estado-captura").className = "medidor-estado " + (fraca ? "fraca" : "ok");
    q("estado-captura").textContent = fraca ? "◐ Abaixo de 50%: adequação fraca." : "✓ A medida tende a alcançar o sacador.";
    q("trilho-terceiros").setAttribute("aria-label", "Terceiros alcançados: " + L.formatarTerceiros(n));
    q("trilho-captura").setAttribute("aria-label", "Chance de captura: " + L.formatarPct(p));
  }

    var m = C.modelo;
    var g = es.gravidade;
    var j = L.janelaHorario(m.centro, estado.janela);
    var termo = C.palavras.termos.find(function (t) { return t.id === estado.termo; });
    var gravidade = h("section", { class: "ficha", "aria-label": "Gravidade do crime" }, [
      h("span", { class: "perna-rotulo", text: "1 · Gravidade" }),
      h("fieldset", null, [
        h("legend", { text: g.pergunta }),
        h("div", { class: "opcoes" }, g.opcoes.map(function (o) {
          return h("label", { class: "opcao" }, [
            h("input", { type: "radio", name: "gravidade", id: "grav-" + o.id, value: o.id, checked: estado.gravidade === o.id,
              onchange: function () { estado.gravidade = o.id; salvar(); render(false, "grav-" + o.id); } }),
            h("span", { text: o.rotulo })
          ]);
        }))
      ]),
      estado.gravidade
        ? h("p", { class: "devolutiva", role: "status", text: estado.gravidade === g.resposta ? g.feedback_certo : g.feedback_errado })
        : null,
      h("label", { class: "chave" }, [
        h("input", { type: "checkbox", id: "adota-hediondos", checked: estado.adotaHediondos,
          onchange: function (ev) { estado.adotaHediondos = ev.target.checked; salvar(); } }),
        h("span", null, [h("strong", { text: g.criterio }), h("br"), h("span", { class: "nota", text: g.fonte })])
      ])
    ]);
    var delimitacao = h("section", { class: "ficha", "aria-label": es.delimitacao.rotulo }, [
      h("span", { class: "perna-rotulo", text: "2 · " + es.delimitacao.rotulo }),
      h("dl", { class: "resumo-param" }, [
        h("dt", { text: "Raio" }), h("dd", { text: estado.raio + " m" }),
        h("dt", { text: "Janela" }), h("dd", { text: estado.janela + " min (" + j.inicio + " às " + j.fim + ")" }),
        h("dt", { text: "Termo" }), h("dd", { text: termo ? termo.rotulo : "" }),
        h("dt", { text: "Período" }), h("dd", { text: estado.dias + " dias" })
      ]),
      h("p", { class: "nota", text: es.delimitacao.fonte })
    ]);
    var etapas = h("section", { class: "ficha", "aria-label": "Descarte dos inocentes" }, [
      h("span", { class: "perna-rotulo", text: "3 · Descarte dos inocentes" }),
      h("label", { class: "chave" }, [
        h("input", { type: "checkbox", id: "etapas", checked: estado.etapas,
          onchange: function (ev) { estado.etapas = ev.target.checked; salvar(); } }),
        h("strong", { text: es.etapas.rotulo })
      ]),
      h("ol", { class: "passos" }, es.etapas.passos.map(function (p) { return h("li", { text: p }); })),
      h("p", { class: "nota", text: es.etapas.fonte })
    ]);
    return [
      h("p", { class: "eyebrow", text: "Tarefa 2 · Proporcionalidade estrita" }),
      titulo("Condicionantes em construção"),
      h("p", { class: "lead", text: es.placar + " Conferido em " + C.conferido_em + "." }),
      gravidade,
      delimitacao,
      etapas,
      nav({ avancar: "Decidir" })
    ];
  }

  // --- Tela 10: decisão e coerência ----------------------------------------------
  function grupoDecisao(perna, rotulo) {
    var d = estado.decisao[perna];
    var fundamentos = C.decisao.fundamentos_indeferimento[perna];
    var filhos = [
      h("legend", { text: rotulo }),
      h("div", { class: "opcoes" }, C.decisao.opcoes.map(function (o) {
        return h("label", { class: "opcao" }, [
          h("input", { type: "radio", name: "dec-" + perna, id: "dec-" + perna + "-" + o.id, value: o.id, checked: d.escolha === o.id,
            onchange: function () { d.escolha = o.id; salvar(); render(false, "dec-" + perna + "-" + o.id); } }),
          h("span", { text: o.rotulo })
        ]);
      }))
    ];
    if (d.escolha === "indefiro") {
      var sel = h("select", { id: "fund-" + perna, onchange: function (ev) { d.fundamento = ev.target.value || null; salvar(); render(false, "fund-" + perna); } },
        [h("option", { value: "", text: "Escolha o fundamento do indeferimento" })].concat(fundamentos.map(function (f) {
          return h("option", { value: f.id, selected: d.fundamento === f.id, text: f.rotulo });
        })));
      filhos.push(h("label", { for: "fund-" + perna, class: "nota", style: "margin-top:0.5rem;display:block", text: "Fundamento" }));
      filhos.push(sel);
    }
    if (d.escolha === "restricoes") {
      filhos.push(h("p", { class: "nota", style: "margin-top:0.5rem", text: perna === "cerca"
        ? "Valem o raio e a janela da tela de adequação e a escolha sobre as etapas."
        : "Valem o termo e o período da tela de adequação." }));
    }
    if (d.escolha === "defiro") {
      filhos.push(h("p", { class: "nota", style: "margin-top:0.5rem", text: "Defere o pedido como veio, sem as suas restrições." }));
    }
    return h("fieldset", { class: "ficha" }, filhos);
  }

  function telaDecisao() {
    var linhas = L.montarDispositivo(estado, C);
    var sinais = L.sinaisIncoerencia(estado, C);
    var completo = linhas.length > 0;
    var resultado = [];
    if (completo) {
      resultado.push(h("section", { class: "dispositivo", "aria-label": "Dispositivo" }, [
        h("span", { class: "dispositivo-cab", text: "Decisão de plantão (fictícia)" })
      ].concat(linhas.map(function (l) { return h("p", { text: l }); }))));
      resultado.push(h("h2", { style: "font-size:1.1rem", text: "Checagem de coerência" }));
      resultado.push(h("ul", { class: "sinais", role: "status" }, sinais.length
        ? sinais.map(function (id) {
            var s = C.decisao.sinais.find(function (x) { return x.id === id; });
            return h("li", null, [h("span", { class: "ico", "aria-hidden": "true", text: "⚠" }), h("span", { text: s.texto })]);
          })
        : [h("li", { class: "limpo" }, [h("span", { class: "ico", "aria-hidden": "true", text: "✓" }), h("span", { text: C.decisao.sem_sinais })])]));
      resultado.push(h("p", { class: "nota", text: C.decisao.fundamento_coerencia }));
    } else {
      resultado.push(h("p", { class: "nota", text: "Decida as duas partes para ver o dispositivo e a checagem de coerência." }));
    }
    return [
      h("p", { class: "eyebrow", text: "Tarefa 2 · Decisão" }),
      titulo("Decida cada parte do pedido"),
      grupoDecisao("cerca", "(a) Cerca geográfica"),
      grupoDecisao("palavra", "(b) Palavras-chave")
    ].concat(resultado, [nav({ avancar: "Ver meu cartão" })]);
  }

  // --- Tela 11: cartão --------------------------------------------------------
  function telaCartao() {
    var c = L.cartao(estado, C);
    // A decisão vai em letras grandes; os parâmetros, numa linha própria em
    // que cada item não quebra ("50 m" nunca se parte em duas linhas).
    function linha(nome, texto) {
      var partes = texto.split(" · ");
      return h("div", { class: "linha" }, [
        h("span", { class: "perna-nome", text: nome }),
        h("span", { class: "valor", text: partes[0] }),
        partes.length > 1 ? h("span", { class: "params" }, partes.slice(1).map(function (p) { return h("span", { text: p }); })) : null
      ]);
    }
    return [
      h("p", { class: "eyebrow", text: "Cartão de decisão" }),
      titulo("Erga o celular"),
      c
        ? h("section", { class: "cartao-decisao", "aria-label": "Sua decisão" }, [linha("Cerca", c.cerca), linha("Palavra-chave", c.palavra)])
        : h("p", { class: "lead", text: "Você ainda não decidiu as duas partes. Volte à tela de decisão." }),
      nav({ avancar: "Fecho" })
    ];
  }

  // --- Tela 12: fecho -----------------------------------------------------------
  function telaFecho() {
    var f = C.fecho;
    return [
      h("p", { class: "eyebrow", text: "Fecho" }),
      titulo("Integridade não é verdade"),
      h("div", { class: "ficha" }, f.frases.map(function (fr) { return h("p", { class: "pergunta-aula", text: fr }); })),
      h("section", { class: "ficha", "aria-label": f.questao.titulo }, [
        h("div", { class: "ficha-cab" }, [h("span", { class: "eyebrow", text: f.questao.titulo }), h("span", { class: "eyebrow", text: "Para casa" })]),
        h("p", { text: f.questao.enunciado })
      ]),
      h("p", { class: "nota", text: "Suas respostas ficam só neste aparelho. Você pode voltar a qualquer tela para revisar." }),
      nav()
    ];
  }

  // --- Render -------------------------------------------------------------------
  var RENDER = {
    abertura: telaAbertura,
    elo: function (t) { return telaElo(t.elo); },
    sintese: telaSintese,
    pedido: telaPedido,
    adequacao: telaAdequacao,
    necessidade: telaNecessidade,
    estrita: telaEstrita,
    decisao: telaDecisao,
    cartao: telaCartao,
    fecho: telaFecho
  };

  function desenharProgresso() {
    var barra = document.getElementById("progresso");
    barra.innerHTML = "";
    TELAS.forEach(function (_, i) {
      barra.append(h("span", { class: i < estado.tela ? "feito" : i === estado.tela ? "atual" : "" }));
    });
    document.getElementById("onde").textContent = TELAS[estado.tela].onde;
  }

  // novaTela: muda de tela (foco no título, rolagem ao topo).
  // focoId: redesenho na mesma tela, devolvendo o foco ao controle tocado.
  function render(novaTela, focoId) {
    var t = TELAS[estado.tela];
    var rolagem = window.scrollY;
    raizTela.innerHTML = "";
    raizTela.className = "tela" + (t.id === "elo" || t.id === "sintese" ? " larga" : "");
    RENDER[t.id](t).forEach(function (n) { if (n) raizTela.append(n); });
    desenharProgresso();
    if (t.id === "adequacao") atualizarMedidores();
    if (novaTela) {
      window.scrollTo(0, 0);
      var tt = raizTela.querySelector(".titulo");
      if (tt) tt.focus({ preventScroll: true });
    } else {
      window.scrollTo(0, rolagem);
      if (focoId) {
        var alvo = document.getElementById(focoId);
        if (alvo) alvo.focus({ preventScroll: true });
      }
    }
  }

  // --- Rodapé: versão e recomeço em duas etapas ---------------------------------
  // O visualizador não mostra confirm(); a confirmação vive na própria página.
  function desenharRecomecar(confirmando) {
    var caixa = document.getElementById("recomecar-caixa");
    caixa.innerHTML = "";
    if (!confirmando) {
      caixa.append(h("button", { type: "button", class: "btn btn-sec", id: "btn-recomecar", onclick: function () { desenharRecomecar(true); } }, ["Recomeçar"]));
      return;
    }
    caixa.append(h("span", { class: "confirma", role: "group", "aria-label": "Confirmar recomeço" }, [
      h("span", { text: "Apagar suas respostas e voltar ao início?" }),
      h("button", { type: "button", class: "btn", id: "btn-apagar", onclick: function () {
        estado = L.estadoInicial(C);
        salvar();
        desenharRecomecar(false);
        render(true);
      } }, ["Apagar"]),
      h("button", { type: "button", class: "btn btn-sec", onclick: function () { desenharRecomecar(false); } }, ["Cancelar"])
    ]));
    document.getElementById("btn-apagar").focus();
  }

  document.getElementById("versao").textContent =
    "Versão " + C.versao + " · conteúdo conferido em " + C.conferido_em + " · caso fictício";
  desenharRecomecar(false);
  render(false);

  // Gancho para os testes de aceitação; não altera o comportamento.
  window.Aula2 = {
    estado: function () { return JSON.parse(JSON.stringify(estado)); },
    irPara: irPara,
    telas: TELAS.length
  };
})();
</script>
